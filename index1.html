<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Mastery</title>
    <!-- Nhập Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Phông chữ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- File CSS tùy chỉnh -->
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Chi tiết trang trí đường nét công nghệ ở các góc -->
    <div class="cyber-line top-left"></div>
    <div class="cyber-line bottom-right"></div>

    <main class="container">
        <!-- Phần Tiêu đề -->
        <header class="header">
            <h1 class="title">Social Mastery<span class="plus-icon">+</span></h1>
            <p class="subtitle">Hãy bấm vào nút để xem cách sử dụng</p>
        </header>

        <!-- Lưới các nút Mạng xã hội -->
        <div class="social-grid">
            <!-- Zalo -->
            <a href="zalo.html" target="_blank" class="social-card">
                <div class="icon-box zalo-box">
                    <span class="zalo-text">Zalo</span>
                </div>
            </a>

            <!-- Facebook -->
            <a href="facebook.html" target="_blank" class="social-card">
                <div class="icon-box fb-box">
                    <i class="bi bi-facebook"></i>
                </div>
            </a>

            <!-- Discord -->
            <a href="discord.html" target="_blank" class="social-card">
                <div class="icon-box discord-box">
                    <i class="bi bi-discord"></i>
                </div>
            </a>

            <!-- Telegram -->
            <a href="telegram.html" target="_blank" class="social-card">
                <div class="icon-box telegram-box">
                    <i class="bi bi-telegram"></i>
                </div>
            </a>

            <!-- WhatsApp -->
            <a href="WhatsApp.html" target="_blank" class="social-card">
                <div class="icon-box whatsapp-box">
                    <i class="bi bi-whatsapp"></i>
                </div>
            </a>

            <!-- TikTok -->
            <a href="tiktok.html" target="_blank" class="social-card">
                <div class="icon-box tiktok-box">
                    <i class="bi bi-tiktok"></i>
                </div>
            </a>

            <!-- YouTube -->
            <a href="youtube.html" target="_blank" class="social-card">
                <div class="icon-box youtube-box">
                    <i class="bi bi-youtube"></i>
                </div>
            </a>

            <!-- Google -->
            <a href="google.html" target="_blank" class="social-card">
                <div class="icon-box google-box">
                    <i class="bi bi-google"></i>
                </div>
            </a>
        </div>
    </main>

</body>
</html>
